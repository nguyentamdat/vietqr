[workspace]
members = ["crates/vietqr-core", "crates/vietqr-render", "crates/vietqr-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Keep target_features so wasm-bindgen/wasm-opt can detect Rust's WASM features.
strip = "debuginfo"
