[package]
name = "vietqr-wasm"
version = "0.1.0"
description = "JSON string WASM bindings for offline VietQR generation, parsing and SVG rendering"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
vietqr-core = { path = "../vietqr-core" }
vietqr-render = { path = "../vietqr-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[lints]
workspace = true
