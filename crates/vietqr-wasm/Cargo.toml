[package]
name = "vietqr-wasm"
version = "0.1.1"
description = "JSON string WASM bindings for offline VietQR generation, parsing and SVG rendering"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
vietqr-core = { path = "../vietqr-core", version = "0.1.1" }
vietqr-render = { path = "../vietqr-render", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[lints]
workspace = true
